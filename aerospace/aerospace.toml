# :::
# :::: DEFAULTS & GLOBALS ::::
# :::::::::::::::::::::::::::::::::
#

# :::
# Start AeroSpace at login
start-at-login = true

# :::
# This is for after a
# macOS user session login, and not
# the machine startup, and not aerospace startup
#
# :::: NOTE: @espadonne requirement:
# :::::     `start-at-login` must be set to `true` in
# :::::     for this to work.
# :::::     
# after-login-command = []

# :::
# This is for aerospace
# post-startup, not the machine
# For commands, see: https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = ['exec-and-forget ghostty']

# :::
# Normalizations, nothing
# to here-see, notta-thing outtan-ordinary
# See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# :::
# To disable accordion
# padding altogether, set to zed
accordion-padding = 18

# :::
# Set to 'tiles' or 'accordion'
# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
default-root-container-layout = 'tiles'

# :::
# Possible values: 
# Set to 'horizontal', 'vertical', or 'auto'
# 
# :::: NOTE: on auto:
# :::::               portrait  viewport :: vertical
# :::::               landscape viewport :: horizontal
# :::::               anything else should follow this gist
default-root-container-orientation = 'auto'

# :::
# Commentout to disable behavior, 
# and falls back to empty list, `[]`, See my todo #1
# See: https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# See: https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']


# :::
# Map it to qwerked 
# up quirty, or everyone's 
# favorite New World Symphonist
# ie, 
# Possible values: 'qwerty', 'dvorak'
#
# :::: NOTE: @espadonne on keymappings:
# :::::     you can do some kind 
# ::::: 	  of cool things like alias keys!
#
# See: https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
	preset = 'qwerty'

# :::
# According to the 
# CSS folks th- well hey what 
# exactly would the container be here?
#
# :::: NOTE: @espadonne params(?)
# ::::: 	constants: 
# ::::: 		inner.{horizontal,vertical}	  =	n
# :::::     	outer.{top,left,right,bottom} = n
# :::::
# ::::: 	multimonitor:
# :::::			I don't really follow it yet;
# ::::: 		DIRECT from the docs:
# :::::
#			Per monitor:  
#			gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#				  See:
# 				  https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
	outer.top =        12
	outer.left =       12
	outer.right =      12
	outer.bottom =     12
	inner.vertical =   6
	inner.horizontal = 6


# :::
# :::: MODES & MODE BINDINGS ::::
# ::::: ::::::::::::::::::::: :::::
#
# NOTE: you can create multiple
#		sets of bindings by making
#		different modes
#
#
# VALID KEYS:
#	- Digits: 		 	0-9
#	- Letters: 		 	a-z
#	- F-Key digits:	 	`f{1,2,...,?}`
#	- Numpad digits: 	`keypad{0,1,...,9}`
#	- Specially Named:	minus, equal, period, comma,
#						slash, backslash, quote, semicolon,
#						backtick, leftSquareBracket, rightSquareBracket,
#						space, enter, esc, backspace, tab
#	- Keypad specials:	keypad{Clear,DecimalMark,Divide,Enter,Equal,Minus,Multiply,Plus}
#
#	- Arrows: up, down, left, right
# 
# VALID MODIFIERS: 
#	- cmd
#	- alt
#	- ctrl
#	- shift


# :::
# psvm or is it 
# pvsm o- hang on is it 
# not like int main(something..
#
# necessary main mode keybinds
