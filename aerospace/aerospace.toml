#
[[on-window-detected]]
	if.app-name-regex-substring = '(?i)^(finder|zotero|skim)'
	run = 'layout floating'

[[on-window-detected]]
	if.app-name-regex-substring = '(?i)^(camera|quicktime|synergy)'
	run = 'layout floating'

