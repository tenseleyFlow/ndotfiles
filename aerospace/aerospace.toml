[[on-window-detected]]
  if.app-name-regex-substring = '(?i)^(reminders|siri|weather|books|clock|notes|ghostty|terminal|alacritty)'
  run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = '(?i)wulftp'
