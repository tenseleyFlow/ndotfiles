# :::
# :::: FLOATING WINDOWS ::::
# ::::: :::::::::::::::: :::::
#
# NOTE: you'll float too ;)
#		- Coppersage the C(L)ow(N)
#			- @espadonne
#       - mfw (just a bittabanta)
#
