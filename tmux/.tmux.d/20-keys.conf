##### keybinds (+ global ON/OFF like Zellij’s Ctrl-G) #####

# Global switch: when OFF, your custom binds are paused and keys pass to apps.
set -g @ui_binds on

# Toggle (Ctrl+g) — refresh status immediately so colors/badge update
unbind -n C-g
bind   -n C-g if-shell -F '#{==:#{@ui_binds},on}' \
  "set -g @ui_binds off; refresh-client -S; display-message 'User binds: OFF (Ctrl+g to re-enable)'" \
  "set -g @ui_binds on;  refresh-client -S; display-message 'User binds: ON'"

# Helper pattern for guarded binds:
#   unbind -n <KEY>
#   bind   -n <KEY> if-shell -F '#{==:#{@ui_binds},on}' "<tmux action>" "send-keys <KEY>"

##### Tabs / windows #####

# New tab
unbind -n C-t
bind   -n C-t if-shell -F '#{==:#{@ui_binds},on}' \
  "new-window" \
  "send-keys C-t"

# Close tab (confirm)
unbind -n C-w
bind   -n C-w if-shell -F '#{==:#{@ui_binds},on}' \
  "confirm-before -p 'Kill window #W? (y/n)' kill-window" \
  "send-keys C-w"

# Previous / Next tab
unbind -n C-M-Left
bind   -n C-M-Left if-shell -F '#{==:#{@ui_binds},on}' \
  "previous-window" \
  "send-keys C-M-Left"

unbind -n C-M-Right
bind   -n C-M-Right if-shell -F '#{==:#{@ui_binds},on}' \
  "next-window" \
  "send-keys C-M-Right"

##### Panes / splits #####

# Split left/right (vertical divider)
unbind -n M-\\
bind   -n M-\\ if-shell -F '#{==:#{@ui_binds},on}' \
  "split-window -h" \
  "send-keys M-\\"

# Split top/bottom (horizontal divider)
unbind -n "M-|"
bind   -n "M-|" if-shell -F '#{==:#{@ui_binds},on}' \
  "split-window -v" \
  "send-keys M-\|"

# Kill pane with Alt+Shift+W (guarded; passes through when binds OFF)
unbind -n M-W
bind   -n M-W if-shell -F '#{==:#{@ui_binds},on}' \
  "confirm-before -p 'Kill pane #P? (y/n)' kill-pane" \
  "send-keys M-W"

# Backup: Ctrl+Alt+w also kills the pane (guarded)
unbind -n C-M-w
bind   -n C-M-w if-shell -F '#{==:#{@ui_binds},on}' \
  "confirm-before -p 'Kill pane #P? (y/n)' kill-pane" \
  "send-keys C-M-w"

##### Pane focus #####

unbind -n C-M-Left
bind   -n C-M-Left if-shell -F '#{==:#{@ui_binds},on}' \
  "select-pane -L" \
  "send-keys C-M-Left"

unbind -n C-M-Right
bind   -n C-M-Right if-shell -F '#{==:#{@ui_binds},on}' \
  "select-pane -R" \
  "send-keys C-M-Right"

unbind -n C-M-Up
bind   -n C-M-Up if-shell -F '#{==:#{@ui_binds},on}' \
  "select-pane -U" \
  "send-keys C-M-Up"

unbind -n C-M-Down
bind   -n C-M-Down if-shell -F '#{==:#{@ui_binds},on}' \
  "select-pane -D" \
  "send-keys C-M-Down"

##### Pane resize #####

unbind -n C-M-S-Left
bind   -n C-M-S-Left if-shell -F '#{==:#{@ui_binds},on}' \
  "resize-pane -L 5" \
  "send-keys C-M-S-Left"

unbind -n C-M-S-Right
bind   -n C-M-S-Right if-shell -F '#{==:#{@ui_binds},on}' \
  "resize-pane -R 5" \
  "send-keys C-M-S-Right"

unbind -n C-M-S-Up
bind   -n C-M-S-Up if-shell -F '#{==:#{@ui_binds},on}' \
  "resize-pane -U 2" \
  "send-keys C-M-S-Up"

unbind -n C-M-S-Down
bind   -n C-M-S-Down if-shell -F '#{==:#{@ui_binds},on}' \
  "resize-pane -D 2" \
  "send-keys C-M-S-Down"
