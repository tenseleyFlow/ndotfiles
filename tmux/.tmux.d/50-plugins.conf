##### plugins (declare first, run TPM last) #####

# tmux-yank: copy without snapping back; use Wayland clipboard
set -g @yank_action 'copy-pipe'
set -g @yank_selection_mouse 'clipboard'
set -g @override_copy_command 'wl-copy'

# Resurrect auto-restore
set -g @continuum-restore 'on'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'junegunn/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# TPM init (must be last in this file)
run '~/.tmux/plugins/tpm/tpm'

# --- Post-plugins yank behavior (Wayland) ---
# Mouse release: copy to clipboard, STAY in copy-mode (no jump)
unbind -T copy-mode-vi MouseDragEnd1Pane
bind   -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"

# y: copy to clipboard AND EXIT copy-mode (back to prompt)
unbind -T copy-mode-vi y
bind   -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Y: copy to clipboard and STAY in copy-mode (handy for multiple yanks)
unbind -T copy-mode-vi Y
bind   -T copy-mode-vi Y send-keys -X copy-pipe-no-clear "wl-copy"

# --- X11 alternative (uncomment if using xclip instead of wl-copy) ---
